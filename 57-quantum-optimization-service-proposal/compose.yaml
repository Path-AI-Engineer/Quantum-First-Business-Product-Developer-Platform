services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8057:8057"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8057/health')"]
      interval: 3s
      timeout: 2s
      retries: 20
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      OPTIMIZATION_API_BASE: http://api:8057
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3057:3057"
