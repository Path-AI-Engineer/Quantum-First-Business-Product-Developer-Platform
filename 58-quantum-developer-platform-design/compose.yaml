services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qdp
      POSTGRES_USER: qdp
      POSTGRES_PASSWORD: local-reference-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qdp -d qdp"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: local-reference-password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 4s
      timeout: 3s
      retries: 20
  otel-collector:
    image: otel/opentelemetry-collector:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      QDP_DATABASE_URL: postgresql://qdp:local-reference-only@postgres:5432/qdp
      QDP_REDIS_URL: redis://redis:6379/0
      QDP_OBJECT_STORE_URL: http://minio:9000
    ports: ["8058:8058"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8058/v1/health/ready')"]
      interval: 4s
      timeout: 3s
      retries: 20
  portal:
    build: ./apps/portal
    environment:
      API_BASE_URL: http://api:8058
      PORT: 3058
      HOSTNAME: 0.0.0.0
    ports: ["3058:3058"]
    depends_on:
      api: {condition: service_healthy}

