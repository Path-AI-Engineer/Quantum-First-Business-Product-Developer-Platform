[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quantum-developer-platform-reference-lab"
version = "0.1.0"
description = "Executable multi-tenant reference design for a quantum-ready developer platform"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.138.2",
  "jsonschema==4.25.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_platform"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["quantum_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=quantum_platform --cov-branch --cov-fail-under=82"

