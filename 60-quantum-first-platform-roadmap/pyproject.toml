[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quantum-first-strategy-control-tower"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi==0.141.1", "networkx==3.5", "pydantic==2.13.1", "uvicorn==0.35.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "hypothesis==6.138.2", "mypy==1.17.1", "pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.11"]

[project.scripts]
roadmap = "strategy_control_tower.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_control_tower"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=strategy_control_tower --cov-report=term-missing --cov-branch --cov-fail-under=82"

