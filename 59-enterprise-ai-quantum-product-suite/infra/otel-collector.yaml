receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}
processors:
  batch: {}
  attributes/sanitize:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: gen_ai.prompt
        action: delete
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces: {receivers: [otlp], processors: [attributes/sanitize, batch], exporters: [debug]}
    metrics: {receivers: [otlp], processors: [batch], exporters: [debug]}

