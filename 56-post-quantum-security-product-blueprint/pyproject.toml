[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "pqc-product-blueprint"
version = "0.1.0"
description = "Offline synthetic cryptographic migration assessment laboratory"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.1",
  "uvicorn==0.52.1",
  "SQLAlchemy==2.0.52",
  "alembic==1.16.5",
  "psycopg[binary]==3.3.4"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.2", "mypy==2.3.0", "jsonschema==4.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pqc_product"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
